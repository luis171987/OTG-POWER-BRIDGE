name: Import approved OTG POWER BRIDGE v0.6.3 promo (one-shot)
on:
  push:
    branches:
      - feat/otg-video-readme-20261107
    paths:
      - .github/workflows/otg-video-import-one-shot.yml
permissions:
  contents: write
jobs:
  import-approved-mp4:
    if: github.repository == 'luis171987/OTG-POWER-BRIDGE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated video branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import verified approved video; remove this temporary workflow
        env:
          VIDEO_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_3LGNf7ndAilQT2Ke6AyVwZmaLYt/df91a511-3483-465c-a3d6-2a4dfb15622a.mp4
          VIDEO_SHA256: 1ce120e0399bf88b157d91d68b750ad6cea68abdd1ab4f0deb0eee84c8710159
        run: |
          set -Eeuo pipefail
          video='assets/videos/OTG_POWER_BRIDGE_V063_COMERCIAL_ESMX_102S.mp4'
          mkdir -p assets/videos
          curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 180 \
            "$VIDEO_URL" -o "$video"
          printf '%s  %s\n' "$VIDEO_SHA256" "$video" | sha256sum --check --status
          test "$(stat -c '%s' "$video")" -eq 17093681
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -- .github/workflows/otg-video-import-one-shot.yml
          git add -- "$video"
          git diff --cached --stat
          git commit -m 'media: conservar video comercial aprobado es-MX de 102 s'
          git push origin HEAD:feat/otg-video-readme-20261107
