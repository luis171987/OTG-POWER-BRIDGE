name: Android CI — build de prueba
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Instalar SDK API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar modo real sin motor de simulación
        run: python3 scripts/validar_modo_real.py
      - name: Validar panel real V0.5.0
        run: python3 scripts/validar_telemetria_v05.py
      - name: Compilar APK debug (NO release pública)
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Verificar APK debug
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar artefacto CI para revisión (no release)
        uses: actions/upload-artifact@v4
        with:
          name: OTG-POWER-BRIDGE-debug-candidato
          path: app/build/outputs/apk/debug/app-debug.apk
